name: Registry sync

# The registry's packages are byte-equivalent extractions of the recipes
# compiled into this crate, and src/registry_golden.rs fails when they drift.
# Today that drift is only ever DETECTED — nothing regenerates the registry, so
# a recipe change breaks the registry's CI and waits for someone to notice.
#
# This closes that loop: a recipe change on `main` regenerates the assets and
# opens a pull request on the registry. It stops there, unsigned, on purpose —
# the ed25519 signing key is not in CI and is not going to be (keys/README.md).
# A maintainer signs the PR branch with `velox sign`, and the registry's own CI
# refuses the merge until every package verifies.
on:
  push:
    branches: [main]
    paths:
      - "src/recipes.rs"
      - "src/agents.rs"
      - "src/integrations.rs"
  workflow_dispatch:

concurrency:
  group: registry-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Regenerate and propose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core

      - uses: actions/checkout@v7
        with:
          repository: tornis-tecnologia/veloxsearch-registry
          path: registry
          # Needs to push a branch and open a PR on the other repository, which
          # GITHUB_TOKEN cannot do. Fine-grained, that repo only:
          # contents: write + pull requests: write.
          token: ${{ secrets.REGISTRY_PR_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Regenerate the package assets
        working-directory: core
        env:
          VELOX_REGISTRY_PATH: ${{ github.workspace }}/registry
          VELOX_UPDATE_REGISTRY: "1"
        run: cargo test --lib regenerate_registry_assets

      - name: Anything actually changed?
        id: diff
        working-directory: registry
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "assets already match the core — nothing to propose"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # The signature in each changed package is now stale: its assets moved.
      # Blank it back to the documented placeholder rather than leaving a value
      # that looks valid and is not — `verify_package` reports a placeholder as
      # UNSIGNED, which is the honest state of this PR.
      - name: Mark changed packages unsigned
        if: steps.diff.outputs.changed == 'true'
        working-directory: registry
        run: |
          set -euo pipefail
          placeholder='AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+Pw=='
          for dir in $(git diff --name-only | cut -d/ -f1-2 | sort -u); do
            [ -f "$dir/manifest.yaml" ] || continue
            sed -i -E "s|^(  value: ).*$|\1$placeholder|" "$dir/manifest.yaml"
            echo "unsigned: $dir"
          done

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        working-directory: registry
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PR_TOKEN }}
          CORE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="sync/core-${CORE_SHA:0:7}"
          git config user.name "veloxsearch-ci"
          git config user.email "tornis@tornis.com.br"
          git checkout -b "$branch"
          git add -A
          git commit -s -m "sync: regenerate package assets from core ${CORE_SHA:0:7}

          Generated by .github/workflows/registry-sync.yml in veloxsearch-oss.
          The signatures are placeholders: a maintainer signs this branch with
          \`velox sign\`, and CI refuses the merge until every package verifies."
          git push -u origin "$branch"
          gh pr create \
            --title "sync: regenerate package assets from core ${CORE_SHA:0:7}" \
            --body "$(cat <<EOF
          Automated by \`registry-sync.yml\` in
          [veloxsearch-oss@${CORE_SHA:0:7}](https://github.com/tornis-tecnologia/veloxsearch-oss/commit/${CORE_SHA}).

          A recipe changed in the core, so these assets were regenerated to match.
          The golden gates would otherwise fail on the next run.

          **These packages are unsigned.** The signing key is not in CI. To
          finish this PR:

          \`\`\`sh
          gh pr checkout <this PR>
          velox sign integrations/<id> --key <your key>   # once per changed package
          git commit -am "sign: re-sign regenerated packages" && git push
          \`\`\`

          CI will refuse the merge while any package still carries the placeholder.
          EOF
          )"
