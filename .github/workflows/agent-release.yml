name: Agent release

# The Velox Agent's own release (ADR-068: separate binary, separate cadence;
# ADR-069 amendment 1: host tarballs + container image + install.sh).
#
# Same model as release.yml: a merge to main that changes the veloxagent
# workspace version publishes. The tag is `velox-agent-v<version>`, never
# `v*` — those are the core's, and the core's release notes diff against the
# previous `v*` release. `make_latest: false` keeps GitHub's "latest" marker
# on the core: docs and users fetch `releases/latest/download/install.yaml`.
#
# Built natively per architecture (an arm64 runner, not QEMU: a Rust release
# build under emulation takes most of an hour), merged into one multi-arch
# image afterwards.
on:
  push:
    branches: [main]
    paths:
      - veloxagent/**
      - crates/velox-policy/**
      - crates/velox-integrations/**
      - .github/workflows/agent-release.yml

concurrency:
  group: agent-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: docker.io/tornistecnologia/velox-agent

jobs:
  gate:
    name: Is this an agent release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          now=$(read_version < veloxagent/Cargo.toml)
          before=$(git show HEAD~1:veloxagent/Cargo.toml 2>/dev/null | read_version || true)
          echo "version=$now" >> "$GITHUB_OUTPUT"
          if [ "$now" = "$before" ]; then
            echo "agent version unchanged ($now) — not a release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/velox-agent-v$now" >/dev/null 2>&1; then
            echo "::error::tag velox-agent-v$now already exists but the version just changed to it"
            exit 1
          fi
          if [ -n "$before" ] && [ "$(printf '%s\n%s\n' "$before" "$now" | sort -V | tail -1)" != "$now" ]; then
            echo "::error::veloxagent version went backwards ($before -> $now)"
            exit 1
          fi
          echo "agent version $before -> $now — releasing"
          echo "release=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Re-verify at the release commit
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veloxagent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: veloxagent
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - working-directory: .
        run: ./.github/scripts/check-agent-boundary.sh
      - working-directory: .
        run: shellcheck -S style veloxagent/deploy/install.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: [gate, verify]
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tarball is the `artifact` stage of the same Dockerfile the image
      # is built from: one recipe, so the host binary and the image binary
      # cannot drift.
      - name: Host tarball
        env:
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build -f veloxagent/deploy/docker/Dockerfile \
            --platform "${{ matrix.platform }}" --target artifact \
            --output type=local,dest=out .
          name="velox-agent-$V-${{ matrix.arch }}-unknown-linux-musl.tar.gz"
          tar -C out -czf "$name" velox-agent LICENSE
          mkdir -p dist && mv "$name" dist/

      - name: Image, pushed by digest
        id: image
        env:
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build -f veloxagent/deploy/docker/Dockerfile \
            --platform "${{ matrix.platform }}" \
            --build-arg VELOX_VERSION="$V" --build-arg VELOX_BUILD_COMMIT="$GITHUB_SHA" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          digest=$(python3 -c 'import json;print(json.load(open("meta.json"))["containerimage.digest"])')
          echo "$digest" > "dist/digest-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v5
        with:
          name: agent-${{ matrix.arch }}
          path: dist/

  publish:
    name: Image manifest, signatures and release
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # the velox-agent-v* tag and its release; no branch
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Multi-arch manifest, signed
        env:
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          refs=$(for f in dist/digest-*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$V" -t "$IMAGE:latest" $refs
          digest=$(docker buildx imagetools inspect "$IMAGE:$V" --format '{{json .Manifest}}' \
                   | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')
          cosign sign --yes "$IMAGE@$digest"
          echo "IMAGE_REF=$IMAGE:$V@$digest" >> "$GITHUB_ENV"
          rm dist/digest-*

      # install.sh verifies these: SHA256SUMS always, the bundle when cosign
      # is on the host (certificate identity = this workflow on this repo).
      - name: Checksums and blob signatures
        run: |
          set -euo pipefail
          cp veloxagent/deploy/install.sh dist/install.sh
          cd dist
          for f in *.tar.gz install.sh; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f" >/dev/null
          done
          sha256sum *.tar.gz install.sh > SHA256SUMS

      - name: Release notes
        env:
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Velox Agent $V."
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/velox-agent-v$V/install.sh"
            echo "sudo bash install.sh --version $V --mesh <MESH_URL> --token <TOKEN>"
            echo '```'
            echo
            echo "Image: \`$IMAGE_REF\`"
          } > NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: velox-agent-v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Velox Agent ${{ needs.gate.outputs.version }}
          body_path: NOTES.md
          make_latest: false
          files: dist/*
