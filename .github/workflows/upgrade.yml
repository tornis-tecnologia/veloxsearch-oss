name: Upgrade (N-1 -> N)

# The upgrade contract (ADR-057, #54): rolling out a new VeloxSearch changes the
# VeloxSearch control plane and nothing it manages — not the operator
# Deployment, not the operator or cert-manager CRDs, not an OpenSearchCluster
# spec — and never re-grants cluster-admin. It also keeps the operator's own
# settings: `veloxsearch-env` comes out of an upgrade exactly as it went in (#128).
#
# The lane installs the PREVIOUS release on minikube, drives a real first run to
# a green deployment, rolls the candidate built from this commit out over it,
# and asserts the contract (tests/upgrade_check.py). Two variants:
#   operator-ready  the documented upgrade (DEPLOY.md): apply the UPGRADE
#                   manifest (deploy/upgrade-manifest.sh), which carries no
#                   bootstrap binding — the lane asserts none ever appears —
#                   and no veloxsearch-env, so a setting made before the
#                   upgrade must reach the new Pod unchanged.
#   operator-down   the worst case: the operator scaled to 0 AND the full
#                   install.yaml re-applied, so bootstrap holds cluster-admin
#                   while the operator is not Ready — the exact state that used
#                   to make it force-apply its bundle. It must apply nothing,
#                   and the running app must revoke the binding afterwards.
#                   install.yaml DOES carry veloxsearch-env, so this variant
#                   resets the setting; its compares skip that one object.
#
# Storage: minikube's default StorageClass is node-local, which deployments ride
# with a warning (ADR-061), so the lane installs no Longhorn.
#
# Trigger: this is the slow lane (cert-manager, the operator and a three-node
# OpenSearch on one runner), so it does NOT run on every push. It runs on pull requests that touch the upgrade surface —
# Cargo.toml, which every release PR changes, the manifests, the bootstrap
# code, and the lane itself — and on demand.
on:
  pull_request:
    paths:
      - Cargo.toml
      - deploy/install.yaml
      - deploy/upgrade-manifest.sh
      - deploy/bootstrap/**
      - src/bootstrap.rs
      - tests/upgrade_check.py
      - .github/workflows/upgrade.yml
  workflow_dispatch:
    inputs:
      from:
        description: "Release tag to upgrade FROM, e.g. v0.9.0 (empty = the latest release)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CANDIDATE_IMAGE: docker.io/library/veloxsearch:candidate
  # A throwaway admin on a throwaway cluster that exists for this job only.
  ADMIN_USER: admin
  ADMIN_PW: upgrade-lane-${{ github.run_id }}
  # An operator setting made before the upgrade (#128). VELOX_PUBLIC_URL only
  # shapes the links in account mail, which this lane never sends, and it is
  # not the shipped default ("").
  SETTING_KEY: VELOX_PUBLIC_URL
  SETTING_VALUE: https://upgrade-lane.invalid
  ENV_SNAPSHOT_KEY: configmap/veloxsearch-system/veloxsearch-env

jobs:
  candidate:
    name: Build the candidate image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: deploy/build-image.sh --profile release --tag "$CANDIDATE_IMAGE"
      - name: Save
        run: docker save "$CANDIDATE_IMAGE" -o candidate.tar
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-image
          path: candidate.tar
          retention-days: 1

  upgrade:
    name: Upgrade (${{ matrix.variant }})
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [operator-ready, operator-down]
    env:
      BASE: http://127.0.0.1:3000
      # runner.temp is not available in job-level env; the path is built in shell.
      STATE_NAME: upgrade-state.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Free runner disk
        # The operator, cert-manager and OpenSearch images plus three PVCs do
        # not fit next to the preinstalled SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v8
        with:
          name: candidate-image

      - name: Install minikube
        run: |
          curl -fsSLO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube version

      - name: Start minikube
        # R4 needs >= 8Gi allocatable; the runner has 16Gi and 4 vCPU.
        run: minikube start --driver=docker --cpus=4 --memory=12g --disk-size=50g --wait=all

      - name: Side-load the candidate image
        run: minikube image load candidate.tar

      - name: Install the previous release (N-1)
        env:
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          if [ -n "${FROM:-}" ]; then
            url="https://github.com/tornis-tecnologia/veloxsearch-oss/releases/download/$FROM/install.yaml"
          else
            url="https://github.com/tornis-tecnologia/veloxsearch-oss/releases/latest/download/install.yaml"
          fi
          curl -fsSL "$url" -o previous-install.yaml
          grep -E 'image: docker\.io/tornistecnologia/veloxsearch-oss' previous-install.yaml
          kubectl apply -f previous-install.yaml
          kubectl -n veloxsearch-system rollout status deploy/veloxsearch --timeout=600s

      - name: Port-forward (survives the rollout)
        # A port-forward dies with the Pod it picked; the loop re-attaches to
        # the Service's new Pod after the upgrade rolls it.
        run: |
          nohup bash -c 'while true; do kubectl -n veloxsearch-system port-forward svc/veloxsearch 3000:80; sleep 2; done' \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &

      - name: "N-1: first run, bootstrap, create a deployment, wait green"
        timeout-minutes: 75
        run: python3 tests/upgrade_check.py prepare "$BASE" "$ADMIN_USER" "$ADMIN_PW" "$RUNNER_TEMP/$STATE_NAME"

      - name: "N-1: the operator changes a setting in veloxsearch-env"
        run: python3 tests/upgrade_check.py env set "$SETTING_KEY" "$SETTING_VALUE"

      - name: "N-1: baseline snapshot"
        run: |
          kubectl get clusterrolebinding veloxsearch-bootstrap || echo "N-1 left no bootstrap binding (expected)"
          python3 tests/upgrade_check.py snapshot "$RUNNER_TEMP/baseline.json"

      - name: "operator-down: scale the operator to 0 before the rollout"
        if: matrix.variant == 'operator-down'
        run: |
          set -euo pipefail
          kubectl -n veloxsearch-system scale deploy/opensearch-operator --replicas=0
          # `kubectl wait --for=delete` errors when the pods are already gone,
          # so poll for "none left" instead.
          for _ in $(seq 60); do
            [ -z "$(kubectl -n veloxsearch-system get pods -l app.kubernetes.io/name=opensearch-operator --no-headers 2>/dev/null)" ] && break
            sleep 3
          done
          [ -z "$(kubectl -n veloxsearch-system get pods -l app.kubernetes.io/name=opensearch-operator --no-headers 2>/dev/null)" ]
          python3 tests/upgrade_check.py snapshot "$RUNNER_TEMP/down.json"

      - name: "N: roll out the candidate"
        # operator-ready applies what DEPLOY.md says (the upgrade manifest);
        # operator-down re-applies the full install manifest on purpose.
        run: |
          set -euo pipefail
          sed -E "s|^(\s*image: )docker\.io/tornistecnologia/veloxsearch-oss:.*$|\1$CANDIDATE_IMAGE|" \
            deploy/install.yaml > candidate-install.yaml
          grep -q "image: $CANDIDATE_IMAGE" candidate-install.yaml
          if [ "${{ matrix.variant }}" = operator-ready ]; then
            deploy/upgrade-manifest.sh candidate-install.yaml > candidate-upgrade.yaml
            kubectl apply -f candidate-upgrade.yaml
          else
            kubectl apply -f candidate-install.yaml
          fi
          kubectl -n veloxsearch-system rollout status deploy/veloxsearch --timeout=600s
          # `rollout status` returns while the N-1 Pod is still Terminating, and
          # a port-forward stays attached to it; the first run of this lane had
          # the OLD binary answer bootstrap_ensure. Wait until only the
          # candidate's Pod exists, then until the port-forward serves again.
          for _ in $(seq 120); do
            [ "$(kubectl -n veloxsearch-system get pods -l app=veloxsearch --no-headers 2>/dev/null | wc -l)" = 1 ] && break
            sleep 5
          done
          kubectl -n veloxsearch-system get pods -l app=veloxsearch -o wide
          [ "$(kubectl -n veloxsearch-system get pods -l app=veloxsearch --no-headers | wc -l)" = 1 ]
          # Re-attach: kill the kubectl child, the loop restarts it on the new Pod.
          pkill -f '^kubectl -n veloxsearch-system port-forward' || true
          for _ in $(seq 60); do curl -fsS -o /dev/null "$BASE/" && break; sleep 2; done
          curl -fsS -o /dev/null "$BASE/"

      - name: "operator-ready: the upgrade granted no cluster-admin"
        if: matrix.variant == 'operator-ready'
        run: python3 tests/upgrade_check.py binding gone --timeout 0

      - name: "operator-ready: the operator's setting survived and reached the new Pod"
        if: matrix.variant == 'operator-ready'
        run: |
          set -euo pipefail
          python3 tests/upgrade_check.py env expect "$SETTING_KEY" "$SETTING_VALUE"
          got=$(kubectl -n veloxsearch-system exec deploy/veloxsearch -- printenv "$SETTING_KEY")
          [ "$got" = "$SETTING_VALUE" ] || { echo "FAIL: the new Pod sees $SETTING_KEY='$got'"; exit 1; }
          echo "  ok: the candidate Pod runs with $SETTING_KEY=$got"

      - name: "operator-down: bootstrap waits and applies nothing"
        if: matrix.variant == 'operator-down'
        run: |
          set -euo pipefail
          python3 tests/upgrade_check.py ensure-noop "$BASE" "$ADMIN_USER" "$ADMIN_PW" --observe 180
          python3 tests/upgrade_check.py binding present
          python3 tests/upgrade_check.py snapshot "$RUNNER_TEMP/down-after.json"
          # install.yaml owns veloxsearch-env; re-applying it resets the setting (#128).
          python3 tests/upgrade_check.py compare "$RUNNER_TEMP/down.json" "$RUNNER_TEMP/down-after.json" \
            --skip "$ENV_SNAPSHOT_KEY"
          kubectl -n veloxsearch-system scale deploy/opensearch-operator --replicas=1
          kubectl -n veloxsearch-system rollout status deploy/opensearch-operator --timeout=300s

      - name: "N: deployment still green"
        run: python3 tests/upgrade_check.py green "$BASE" "$ADMIN_USER" "$ADMIN_PW" "$RUNNER_TEMP/$STATE_NAME" --timeout 900

      - name: "N: no bootstrap binding left behind"
        run: python3 tests/upgrade_check.py binding gone --timeout 420

      - name: "N: operator, CRDs, OpenSearchCluster and veloxsearch-env unchanged"
        # Give anything the new binary might do on its own a couple of minutes
        # (the revoke watch ticks every 60s, the sampler every 60s).
        run: |
          sleep 120
          python3 tests/upgrade_check.py snapshot "$RUNNER_TEMP/after.json"
          skip=()
          if [ "${{ matrix.variant }}" = operator-down ]; then
            # It re-applied install.yaml, which owns veloxsearch-env.
            skip=(--skip "$ENV_SNAPSHOT_KEY")
          fi
          python3 tests/upgrade_check.py compare "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/after.json" "${skip[@]}"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n veloxsearch-system logs deploy/veloxsearch --tail=300 || true
          kubectl -n veloxsearch-system get configmap veloxsearch-env -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          cat "$RUNNER_TEMP/port-forward.log" || true
          for f in baseline down down-after after; do
            [ -f "$RUNNER_TEMP/$f.json" ] && echo "== $f" && head -c 4000 "$RUNNER_TEMP/$f.json" && echo
          done
