# cargo-deny — the supply-chain gate the `supply-chain` CI job runs.
#
# Four independent checks: advisories (known vulnerabilities), licenses (what we
# are allowed to link against), bans (duplicate/unwanted crates) and sources
# (where crates may come from). Run it locally with:
#
#   cargo install cargo-deny && cargo deny check

[graph]
all-features = true

[advisories]
# An advisory with no fix available still fails the build. That is deliberate:
# the decision to ship anyway should be a visible `ignore` entry with a reason,
# not a silent pass.
yanked = "deny"
ignore = []

[licenses]
# VeloxSearch is AGPL-3.0-only, so it may link anything permissive. The list is
# an allowlist rather than a copyleft denylist: a new dependency arriving under
# an unexpected licence should stop CI and get a decision, not be inferred.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Unicode character tables (unicode-ident and friends). Permissive; the
    # Unicode consortium's own terms.
    "Unicode-3.0",
    # This crate itself.
    "AGPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning, not a failure: the Kubernetes and TLS stacks
# legitimately pull overlapping minor versions, and failing on that would make
# every upstream bump a blocking incident.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # One rustls crypto provider, process-wide. `main.rs` installs aws-lc-rs;
    # a second provider is dead weight in the image and, worse, makes which one
    # is in force a function of link order. Every TLS-using dependency in
    # Cargo.toml is feature-selected to avoid this — keep it that way.
    { name = "ring", reason = "aws-lc-rs is the process-wide rustls provider; see Cargo.toml" },
    # No OpenSSL in the image: the runtime base is debian-slim with ca-certificates
    # and nothing else. Anything reaching for native-tls has been mis-featured.
    { name = "openssl-sys", reason = "rustls only; the runtime image ships no OpenSSL" },
]

[sources]
# crates.io only. A git or path dependency in a published control plane is a
# supply-chain hole that no lockfile review would catch.
unknown-registry = "deny"
unknown-git = "deny"
