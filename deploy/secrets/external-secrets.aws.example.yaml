# External Secrets Operator — AWS Secrets Manager store + the operator-
# provisioned VeloxSearch secrets (ADR-034). EXAMPLE: copy, fill the
# <PLACEHOLDERS>, then apply. Contains references only — no secret values.
#
# Prereqs: ESO installed (see README.md); vault-side entries created under
# the veloxsearch/ prefix (paths below; inventory in docs/SECRETS.md).
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: veloxsearch-vault
spec:
  provider:
    aws:
      service: SecretsManager
      region: <AWS_REGION> # e.g. us-east-1
      auth:
        # Preferred (EKS): IRSA — annotate ESO's ServiceAccount with the IAM
        # role ARN and delete the secretRef block below.
        # Fallback (k3s / non-AWS clusters): a bootstrap access key. This is
        # the ONE secret created by hand; scope its IAM policy to
        # secretsmanager:GetSecretValue on arn:...:secret:veloxsearch/*.
        secretRef:
          accessKeyIDSecretRef:
            name: awssm-bootstrap
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: awssm-bootstrap
            namespace: external-secrets
            key: secret-access-key
    # Provider swap (HashiCorp Vault on AWS): replace `aws:` with a `vault:`
    # block (server, path, auth) — the ExternalSecrets below stay unchanged.
---
# Private-registry fallback pull secret (docs/INSTALLER.md). Replaces the
# manual `velox init --pull-token …` step when a vault is in play.
# Vault entry veloxsearch/registry/pull is a JSON object:
#   {"user": "...", "token": "..."}   (a registry deploy token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velox-pull
  namespace: veloxsearch-system # the namespace of your install
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: veloxsearch-vault
  target:
    name: velox-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"docker.io":{"username":"{{ .user }}","password":"{{ .token }}"}}}
  data:
    - secretKey: user
      remoteRef: { key: veloxsearch/registry/pull, property: user }
    - secretKey: token
      remoteRef: { key: veloxsearch/registry/pull, property: token }
