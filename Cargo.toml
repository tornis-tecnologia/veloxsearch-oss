[package]
name = "veloxsearch"
version = "0.8.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Wizard-style admin interface that automates OpenSearch observability setup on Kubernetes"
repository = "https://github.com/tornis-tecnologia/veloxsearch-oss"
homepage = "https://github.com/tornis-tecnologia/veloxsearch-oss"
documentation = "https://github.com/tornis-tecnologia/veloxsearch-oss/tree/main/docs"
readme = "README.md"
authors = ["Tornis Desenvolvimento <tornis@tornis.com.br>"]
keywords = ["kubernetes", "opensearch", "observability", "operator", "logging"]
categories = ["command-line-utilities", "web-programming"]
# The MSRV the `msrv` CI job pins and verifies on every PR. Bump it in the same
# commit that starts depending on a newer toolchain feature, never silently.
rust-version = "1.88"
# Not published to crates.io: the deliverable is a container image + the
# one-file install manifest, and the crate compiles in cluster manifests
# (`include_str!` over deploy/) that make no sense as a registry artifact.
publish = false

# Lints. The two `doc_*` allows are deliberate: this codebase's doc-comments
# carry hand-aligned tables and continuation blocks (per-recipe log formats in
# `recipes.rs`, the auth precedence list in `auth.rs`) whose columns ARE the
# readability. Reflowing them to satisfy a rustdoc-markdown nicety would trade a
# real property for a cosmetic one. Everything else stays at clippy's default,
# and CI runs with `-D warnings`.
[lints.clippy]
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"

[lib]
crate-type = ["rlib"]

[dependencies]
axum = "0.8.0"
# SPA static-file serving (ServeDir + index.html fallback) for the React build.
tower-http = { version = "0.7", features = ["fs"], optional = true }
# `net`/`time` are used directly by the auth-provider reachability probe
# (ADR-045) — named explicitly rather than relying on another crate's features.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
futures = { version = "0.3" }
serde_yaml = { version = "0.9", optional = true }

# Server-only (Kubernetes / OpenSearch) dependencies.
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "runtime", "derive"], optional = true }
rustls = { version = "0.23", optional = true }
hmac = { version = "0.12", optional = true }
bcrypt = { version = "0.19", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
# `rustls-tls-webpki-roots-no-provider`, NOT `rustls-tls`: reqwest's plain
# `rustls-tls` resolves to `__rustls-ring`, which links ring as a SECOND crypto
# provider beside the aws-lc-rs one `main.rs` installs process-wide — the exact
# trap the `lettre` note below describes. The `-no-provider` variant keeps the
# same webpki root store and defers to the installed default provider.
# `cargo deny check bans` fails if ring ever comes back (deny.toml).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "json",
], optional = true }
k8s-openapi = { version = "0.26", features = ["v1_30"], optional = true }
# Build raw API-server requests for the kubelet Summary API (nodes/proxy), which
# kube-rs exposes via `Client::request` but has no typed helper for.
http = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }
# OS CSPRNG for per-cluster admin password generation (security: no hardcoded default).
getrandom = { version = "0.3", optional = true }
# Control-plane datastore bring-up (ADR-041, #92): connection + the plain-SQL
# migration runner only. Deliberately the bare driver — the query layer
# (sqlx vs. diesel) is a later, separate decision.
tokio-postgres = { version = "0.7", optional = true }
# Directory client for the ADR-045 LDAP probe: the pre-save test binds as the
# configured bind DN and runs the user/role searches, which TCP reachability
# alone cannot confirm (MR4, #56). rustls to match every other TLS user here —
# no native-tls/openssl in the image.
# aws-lc-rs, not ring: `main.rs` installs aws_lc_rs as the process-wide rustls
# provider, and a second provider here would be dead weight in the image.
# Transactional email for the control-plane account flows (#79): signup
# verification and password-reset links. The bare protocol is not worth
# hand-rolling (EHLO/STARTTLS/AUTH/MIME quoting), and delivery is OPTIONAL —
# with no `VELOX_SMTP_HOST` the mailer logs the link instead and this crate is
# never dialled. rustls + aws-lc-rs to match the process-wide provider
# `main.rs` installs; `rustls-tls` is deliberately NOT used because it drags in
# ring as a second provider.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "tokio1",
    "tokio1-rustls",
    "aws-lc-rs",
    "webpki-roots",
], optional = true }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"], optional = true }
# Parse the operator-supplied private CA (`pemtrustedcas_content`) into the
# rustls root store the LDAP probe dials with, so an LDAPS directory behind an
# internal CA probes the same way the cluster will reach it.
#
# `rustls-pki-types`, not `rustls-pemfile`: the latter is unmaintained and
# archived (RUSTSEC-2025-0134), and its last release was a thin wrapper around
# exactly this crate's `PemObject` trait. Not a new dependency either — rustls
# already pulls it in.
rustls-pki-types = { version = "1.14", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# Registry package signatures (ADR-039 / docs/integrations/signing.md, #75): the `value`
# field of a manifest's signature block is base64.
base64 = { version = "0.23", optional = true }
# ed25519 verification of registry packages. NOT a new crypto stack: aws-lc-rs
# is already linked into the binary as the process-wide rustls provider
# (`main.rs`), so this is a direct name for a dependency we already ship —
# same reasoning that picked it over ring for the LDAP probe above.
aws-lc-rs = { version = "1.17", default-features = false, features = ["aws-lc-sys"], optional = true }

[features]
default = ["ssr"]
# The server feature: gates the Kubernetes/OpenSearch layer + HTTP handlers.
# (Kept as a feature so the bare DTOs in `api` can still be compiled alone.)
ssr = [
    "dep:tower-http",
    "dep:serde_yaml",
    "dep:kube",
    "dep:k8s-openapi",
    "dep:http",
    "dep:rustls",
    "dep:hmac",
    "dep:bcrypt",
    "dep:sha2",
    "dep:hex",
    "dep:reqwest",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:getrandom",
    "dep:tokio-postgres",
    "dep:ldap3",
    "dep:rustls-pki-types",
    "dep:rustls-native-certs",
    "dep:lettre",
    "dep:base64",
    "dep:aws-lc-rs",
]
